site_name: enma
site_description: Android and iOS runtime analysis toolkit
site_url: https://qusamulab.github.io/enma/
repo_url: https://github.com/qusamulab/enma
repo_name: qusamulab/enma
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - tables
  - toc:
      permalink: true

validation:
  links:
    anchors: warn

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ja
          name: 日本語
          build: true
          site_description: Android・iOS ランタイム解析ツール
          nav_translations:
            Getting started: はじめに
            Usage: 使い方
            Platform setup: Android・iOS の準備
            Command reference: コマンド一覧
            Agent reference: エージェント一覧
            Output files: 出力ファイル
            Troubleshooting: トラブルシューティング
            Development: 開発
            Architecture: 構成とデータの流れ
            Development guide: 開発ガイド

nav:
  - Getting started: index.md
  - Usage:
      - Platform setup: platforms.md
      - Command reference: subcommands.md
      - Agent reference: agents.md
      - Output files: output-files.md
      - Troubleshooting: troubleshooting.md
  - Development:
      - Architecture: architecture.md
      - Development guide: development.md
