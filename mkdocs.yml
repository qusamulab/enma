site_name: enma
site_description: Android・iOS ランタイム解析ツール
site_url: https://qusamulab.github.io/enma/
repo_url: https://github.com/qusamulab/enma
repo_name: qusamulab/enma
edit_uri: edit/main/docs/

theme:
  name: material
  language: ja
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - tables
  - toc:
      permalink: true

validation:
  links:
    anchors: warn

plugins:
  - search

nav:
  - はじめに: index.md
  - 使い方:
      - Android・iOS の準備: platforms.md
      - コマンド一覧: subcommands.md
      - エージェント一覧: agents.md
      - 出力ファイル: output-files.md
      - トラブルシューティング: troubleshooting.md
  - 開発:
      - 構成とデータの流れ: architecture.md
      - 開発ガイド: development.md
