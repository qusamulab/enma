site_name: enma
site_description: Frida-based Android security research toolkit
site_url: https://qusamulab.github.io/enma
repo_url: https://github.com/qusamulab/enma
repo_name: qusamulab/enma
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Usage:
      - Subcommands: subcommands.md
      - Agent Reference: agents.md
      - Output Files: output-files.md
  - Reference:
      - Architecture: architecture.md
      - Development: development.md
